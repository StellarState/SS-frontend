name: Frontend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint, Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Upload source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        run: |
          npx @sentry/cli releases new "${SENTRY_RELEASE:-${{ github.sha }}}" || true
          npx @sentry/cli releases files "${SENTRY_RELEASE:-${{ github.sha }}}" upload-sourcemaps .next --url-prefix '~/_next' || true
          npx @sentry/cli releases finalize "${SENTRY_RELEASE:-${{ github.sha }}}" || true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Run tests
        run: npm test -- --passWithNoTests
